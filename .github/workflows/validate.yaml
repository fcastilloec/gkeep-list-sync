name: Validate

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-hacs:
    name: Validate HACS and Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          ignore: brands

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  publish:
    name: Publish to GitHub Releases
    needs: validate-hacs
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write # Required to create GitHub releases and compare tags

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Latest & Previous Tag
        id: tags
        uses: JinoArch/get-latest-tag@97f4fa11855e98585e5898d9cb62117fc04975a6 # latest

      - name: Create a release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV_TAG: ${{ steps.tags.outputs.previousTag }}
          LATEST_TAG: ${{ steps.tags.outputs.latestTag }}
          GH_REPO: ${{ github.repository }}
        run: |
          BODY="https://github.com/${GH_REPO}/compare/${PREV_TAG}...${LATEST_TAG}"
          gh release create "${LATEST_TAG}" \
            --title "${LATEST_TAG}" \
            --notes "${BODY}"
